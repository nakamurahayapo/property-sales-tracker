<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>物件工程表</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/schedule.css">
</head>
<body>

  <header class="app-header">
    <h1>🗓 物件工程表</h1>
    <nav class="app-nav">
      <a href="index.html" class="app-nav-link">📋 販売管理</a>
      <a href="shiire.html" class="app-nav-link">🔍 仕入ボード</a>
    </nav>
  </header>

  <div class="main-content">
    <a href="index.html" class="back-link">← 物件一覧へ戻る</a>

    <div id="schedule-root">
      <div class="loading"><div class="loading-spinner"></div>読み込み中...</div>
    </div>
  </div>

  <!-- 承認・差戻しモーダル（上長用） -->
  <div class="modal-overlay" id="approval-modal-overlay" hidden>
    <div class="modal" style="max-width:440px">
      <div class="modal-header">
        <h2 id="approval-modal-title">工程表を承認</h2>
        <button class="modal-close" id="approval-modal-close">×</button>
      </div>
      <form id="approval-form">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label">承認者（上長）</label>
            <select id="approval-approver"></select>
          </div>
          <div class="form-group">
            <label class="form-label">承認パスワード</label>
            <input type="password" id="approval-password" autocomplete="off" required>
          </div>
          <div class="form-group">
            <label class="form-label" id="approval-comment-label">コメント（任意）</label>
            <textarea id="approval-comment" rows="3"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="approval-modal-cancel">キャンセル</button>
          <button type="submit" class="btn btn-accent" id="approval-modal-submit">承認する</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <script src="js/config.js"></script>
  <script src="js/schedule.js"></script>
</body>
</html>
