<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>買取再販 物件販売管理</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="app-header">
    <h1>🏠 買取再販 物件販売管理</h1>
  </header>

  <div class="main-content">

    <!-- サマリー -->
    <div class="summary-grid">
      <div class="stat-tile">
        <div class="stat-tile-label">物件数</div>
        <div class="stat-tile-value"><span id="stat-count">0</span><span class="stat-tile-unit">件</span></div>
      </div>
      <div class="stat-tile">
        <div class="stat-tile-label">区画数</div>
        <div class="stat-tile-value"><span id="stat-lot-count">0</span><span class="stat-tile-unit">件</span></div>
      </div>
      <div class="stat-tile">
        <div class="stat-tile-label">合計粗利</div>
        <div class="stat-tile-value accent"><span id="stat-gross-profit">0</span><span class="stat-tile-unit">万円</span></div>
      </div>
      <div class="stat-tile">
        <div class="stat-tile-label">仕入決済まで7日以内</div>
        <div class="stat-tile-value danger"><span id="stat-due-soon">0</span><span class="stat-tile-unit">件</span></div>
      </div>
    </div>

    <!-- 担当者別サマリー -->
    <div class="card">
      <div class="card-header">担当者別 合計粗利</div>
      <div class="card-body">
        <div class="staff-summary-list" id="staff-summary-list"></div>
      </div>
    </div>

    <!-- ツールバー：フィルタ・検索・新規登録 -->
    <div class="toolbar">
      <div class="toolbar-group">
        <select id="filter-status">
          <option value="active" selected>状態：販売中</option>
          <option value="sold">状態：成約済み</option>
          <option value="all">状態：すべて</option>
        </select>
        <select id="filter-staff">
          <option value="">担当：すべて</option>
        </select>
        <input type="text" id="search-name" placeholder="物件名で検索">
      </div>
      <button class="btn btn-accent" id="add-property-btn">＋ 新規登録</button>
    </div>

    <!-- 粗利比較グラフ -->
    <div class="card">
      <div class="card-header">物件別 粗利比較</div>
      <div class="card-body">
        <div class="chart-wrap">
          <div id="gross-profit-chart-wrap"></div>
          <div class="empty-state" id="gross-profit-chart-empty" style="display:none">
            <div class="empty-icon">📊</div>表示できるデータがありません
          </div>
        </div>
      </div>
    </div>

    <!-- 物件一覧テーブル -->
    <div class="card">
      <div class="card-header">物件一覧</div>
      <div class="table-scroll">
        <table class="property-table" id="property-table">
          <thead>
            <tr>
              <th data-sort-key="name" data-label="物件名">物件名</th>
              <th data-sort-key="lotName" data-label="区画">区画</th>
              <th data-sort-key="staff" data-label="担当">担当</th>
              <th data-sort-key="startPrice" data-label="販売開始価格">販売開始価格</th>
              <th data-sort-key="currentPrice" data-label="現在価格">現在価格</th>
              <th data-sort-key="grossProfit" data-label="粗利">粗利</th>
              <th data-sort-key="settlementDate" data-label="仕入決済予定日">仕入決済予定日</th>
              <th data-sort-key="salesStartDate" data-label="販売開始日">販売開始日</th>
              <th data-sort-key="priceChangeDate" data-label="価格変更日">価格変更日</th>
              <th class="no-sort">状態</th>
              <th class="no-sort">操作</th>
            </tr>
          </thead>
          <tbody id="property-list-body">
            <tr><td colspan="11"><div class="loading"><div class="loading-spinner"></div>読み込み中...</div></td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- 登録・編集モーダル -->
  <div class="modal-overlay" id="property-modal-overlay" hidden>
    <div class="modal">
      <div class="modal-header">
        <h2 id="property-modal-title">物件を新規登録</h2>
        <button class="modal-close" id="property-modal-close">×</button>
      </div>
      <form id="property-form">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label">物件名（分譲地名など） <span style="color:var(--danger)">*必須</span></label>
            <input type="text" id="field-name" required>
          </div>

          <div class="form-group" id="documents-section" hidden>
            <label class="form-label">販売資料</label>
            <div class="document-list" id="documents-list"></div>
            <input type="file" id="document-upload-input" multiple accept=".pdf,.jpg,.jpeg,.png,.doc,.docx,.xls,.xlsx,.ppt,.pptx">
            <div class="form-hint" id="documents-upload-hint">物件の販売資料（PDF・画像・Office文書など）をアップロードできます</div>
          </div>
          <div class="form-hint" id="documents-new-property-hint" hidden>販売資料は物件の保存後、「編集」から追加できます</div>

          <div id="lots-container"></div>
          <button type="button" class="btn btn-secondary" id="add-lot-btn">＋ 区画を追加</button>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-danger" id="property-modal-delete-all" hidden>物件を削除（全区画）</button>
          <div style="flex:1"></div>
          <button type="button" class="btn btn-secondary" id="property-modal-cancel">キャンセル</button>
          <button type="submit" class="btn btn-accent" id="property-modal-submit">保存する</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 履歴モーダル -->
  <div class="modal-overlay" id="history-modal-overlay" hidden>
    <div class="modal" style="max-width:640px">
      <div class="modal-header">
        <h2 id="history-modal-title">価格推移</h2>
        <button class="modal-close" id="history-modal-close">×</button>
      </div>
      <div class="modal-body">
        <div class="chart-wrap">
          <div id="history-chart-wrap"></div>
        </div>
        <table class="history-table">
          <thead>
            <tr><th>日付</th><th>価格</th><th>増減</th></tr>
          </thead>
          <tbody id="history-table-body"></tbody>
        </table>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" id="history-modal-ok">閉じる</button>
      </div>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
